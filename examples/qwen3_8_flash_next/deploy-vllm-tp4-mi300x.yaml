apiVersion: v1
kind: Service
metadata:
  name: qwen38-vllm
  namespace: qwen38-lab
spec:
  selector:
    app: qwen38-vllm
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-vllm
  namespace: qwen38-lab
  labels:
    app: qwen38-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen38-vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qwen38-vllm
    spec:
      nodeSelector:
        kubernetes.io/hostname: gpu-pool-d4tin
      tolerations:
      - operator: Exists
      terminationGracePeriodSeconds: 60
      securityContext:
        supplementalGroups: [44, 110, 991]
      containers:
      - name: vllm
        image: vllm/vllm-openai-rocm:qwen38-flash-next
        imagePullPolicy: IfNotPresent
        command: ["vllm", "serve"]
        args:
        - /model
        - --served-model-name=Qwen3.8-Flash-Next
        - --tensor-parallel-size=4
        - --enable-expert-parallel
        - --max-num-seqs=256
        - --gpu-memory-utilization=0.90
        - --enable-prefix-caching
        - --no-enable-flashinfer-autotune
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_coder
        - --reasoning-parser=qwen3
        - --host=0.0.0.0
        - --port=8000
        env:
        - name: VLLM_ROCM_USE_AITER_SAMPLER
          value: "0"
        - name: VLLM_CACHE_ROOT
          value: /cache/vllm
        - name: TRITON_CACHE_DIR
          value: /cache/triton
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /cache/inductor
        - name: HF_HOME
          value: /cache/hf
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 200
        resources:
          limits:
            amd.com/gpu: "4"
            ephemeral-storage: 60Gi
          requests:
            amd.com/gpu: "4"
            ephemeral-storage: 10Gi
        securityContext:
          capabilities:
            add: ["SYS_PTRACE"]
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - {mountPath: /model, name: model, readOnly: true}
        - {mountPath: /model/config.json, name: cfg, subPath: config.json, readOnly: true}
        - mountPath: /opt/vllm-pr16/vllm/models/qwen3_8_flash_next/amd/ple_layer.py
          name: plepatch
          subPath: ple_layer.py
          readOnly: true
        - mountPath: /opt/vllm-pr16/vllm/v1/sample/ops/topk_topp_sampler.py
          name: samplerpatch
          subPath: topk_topp_sampler.py
          readOnly: true
        - {mountPath: /dev/shm, name: shm}
        - {mountPath: /cache, name: cache}
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: qwen38-model
          readOnly: true
      - name: cfg
        configMap:
          name: qwen38-vllm-config
      - name: plepatch
        configMap:
          name: qwen38-ple-patch
      - name: samplerpatch
        configMap:
          name: qwen38-sampler-patch
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 64Gi}
      - name: cache
        emptyDir: {sizeLimit: 50Gi}
